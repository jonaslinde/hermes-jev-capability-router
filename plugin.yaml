name: jev-capability-router
version: "0.1.0"
description: Advisory Jev routing for Hermes profiles, skills, and available capabilities.
author: Jonas Linde
license: MIT
homepage: https://github.com/jonaslinde/hermes-jev-capability-router
tags: [hermes, jev, typesafe, routing, advisory]
provides_tools:
  - jev_route_profile
  - jev_suggest_skills
  - jev_router_status
requires_env:
  - name: OPENROUTER_API_KEY
    description: OpenRouter key used only for TypeSafe Jev Decisions requests.
    secret: true
config_schema:
  model:
    type: str
    default: "typesafe/jev-1.13"
  endpoint:
    type: str
    default: "https://openrouter.ai/api/alpha/decisions"
  profile_confidence:
    type: float
    default: 0.70
  skill_confidence:
    type: float
    default: 0.55
  profile_excerpt_chars:
    type: int
    default: 1200
